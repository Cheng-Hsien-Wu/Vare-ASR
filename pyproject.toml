[project]
name = "vare"
version = "0.5.0"
description = "Batch Speech-to-Text Tool with LLM Enhancement"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Cheng-Hsien Wu" }
]
dependencies = [
    # App / UI
    "flet",

    # Speech-to-Text
    "faster-whisper",
    "ctranslate2",
    "onnxruntime",
    "av",

    # LLM Providers
    "openai",
    "anthropic",
    "google-genai",
    "tiktoken",

    # HuggingFace
    "huggingface-hub",
    "tokenizers",
    "hf-xet",
    "filelock",
    "fsspec",

    # Networking / Core
    "httpx",
    "httpcore",
    "h11",
    "requests",
    "urllib3",
    "websockets",
    "sniffio",
    "anyio",
    "idna",
    "certifi",
    "charset-normalizer",

    # Data / Runtime
    "numpy",
    "protobuf",
    "flatbuffers",
    "regex",
    "msgpack",
    "pyyaml",

    # Typing / Models
    "pydantic",
    "pydantic-core",
    "annotated-types",
    "typing-extensions",
    "typing-inspection",

    # Utils
    "tqdm",
    "coloredlogs",
    "distro",
]



[tool.flet]
org = "com.cheng-hsien-wu"
product = "Vare"
company = "Cheng-Hsien Wu"
copyright = "Copyright (C) 2026 Cheng-Hsien Wu"

[tool.flet.app]
path = "."
